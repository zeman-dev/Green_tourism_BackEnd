<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Підтвердження зміни email</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f6f3;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background-color: #f4f6f3; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 520px;
              background-color: #ffffff;
              border-radius: 12px;
              padding: 32px;
            "
          >
            <tr>
              <td
                style="
                  font-size: 20px;
                  font-weight: bold;
                  color: #2f4a2c;
                  padding-bottom: 16px;
                "
              >
                Природні Мандри
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-size: 16px;
                  color: #1f1f1f;
                  line-height: 1.5;
                  padding-bottom: 12px;
                "
              >
                Вітаємо, {{name}}!
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-size: 16px;
                  color: #1f1f1f;
                  line-height: 1.5;
                  padding-bottom: 24px;
                "
              >
                Ми отримали запит на зміну email вашого акаунта на
                <strong>{{newEmail}}</strong>. Щоб підтвердити зміну, натисніть
                кнопку нижче.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom: 24px">
                <a
                  href="{{link}}"
                  target="_blank"
                  style="
                    display: inline-block;
                    background-color: #3c6a37;
                    color: #ffffff;
                    text-decoration: none;
                    font-size: 16px;
                    font-weight: bold;
                    padding: 12px 28px;
                    border-radius: 8px;
                  "
                >
                  Підтвердити
                </a>
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-size: 14px;
                  color: #5b5b5b;
                  line-height: 1.5;
                  padding-bottom: 8px;
                "
              >
                Посилання дійсне 1 годину.
              </td>
            </tr>
            <tr>
              <td style="font-size: 14px; color: #5b5b5b; line-height: 1.5">
                Якщо ви не запитували зміну email — просто проігноруйте цей
                лист, ваші дані залишаться без змін.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
